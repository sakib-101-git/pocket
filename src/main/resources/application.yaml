spring:
  application:
    name: pocket
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/pocket}
    username: ${DATABASE_USERNAME:pocket}
    password: ${DATABASE_PASSWORD:pocket}
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:please-dont-hack-my-broke-student-wallet-app}
  expiration-ms: 900000

plaid:
  client-id: ${PLAID_CLIENT_ID:}
  secret: ${PLAID_SECRET:}

logging:
  level:
    org.springframework.security: DEBUG