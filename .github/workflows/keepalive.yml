# Supabase pauses free projects after 7 days without activity, which leaves the
# Render API hanging on startup. /actuator/health runs a DB check, so pinging it
# twice a week keeps both awake.
name: keepalive

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 https://pocket-pm71.onrender.com/actuator/health
